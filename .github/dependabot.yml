version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 10
    groups:
      prisma:
        patterns:
          - '@prisma/*'
          - 'prisma'
      dev-dependencies:
        dependency-type: 'development'
        exclude-patterns:
          - '@prisma/*'
          - 'prisma'
    ignore:
      # ts-jest doesn't expose TypeScript 7's restructured compiler API yet -- a grouped
      # dev-dependencies PR bumping to 7.0.2 broke `npm test` on every CI leg (confirmed via a
      # real failed run, not guessed). Revisit once ts-jest adds TS7 support.
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
      # pinned to track this repo's own `engines.node` floor (>=18) -- a newer @types/node
      # major types against Node APIs that don't exist on the oldest Node version this project
      # still supports and tests in CI (build-and-test's node-version matrix includes 18).
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # `prisma`/`@prisma/client` (devDependencies only -- the runtime `dependencies`
      # @prisma/generator-helper and @prisma/internals are already on 7.x) stay on 6.19.3 on
      # purpose: their own `preinstall` script hard-fails on Node < 20.19 (confirmed via a real
      # failed install, not guessed), which would break every Node 18 CI leg outright. A
      # grouped PR proposing 6.19.3 -> 7.9.1 for both already did exactly this once.
      - dependency-name: 'prisma'
        update-types: ['version-update:semver-major']
      - dependency-name: '@prisma/client'
        update-types: ['version-update:semver-major']
      # rimraf 6.x requires Node >=20 (5.x supports 18) -- it's only used for this repo's own
      # `clean` script, no reason to risk the Node 18 CI leg for it.
      - dependency-name: 'rimraf'
        update-types: ['version-update:semver-major']
      # @changesets/cli 3.x and @changesets/changelog-github 1.x both require Node >=22.11
      # (confirmed via npm view, not guessed) on top of the already-known yarn >=4.5.2
      # requirement that breaks this repo's Yarn Classic 1.x setup (see
      # release.yml's own comment on the changesets/action pin). Revisit both together if this
      # repo ever moves off Yarn Classic.
      - dependency-name: '@changesets/cli'
        update-types: ['version-update:semver-major']
      - dependency-name: '@changesets/changelog-github'
        update-types: ['version-update:semver-major']
      # change-case 5.x is ESM-only ("type": "module", exports expose only an `import`
      # condition) and this package is published as CommonJS, so `require('change-case')`
      # throws ERR_REQUIRE_ESM -- verified by actually installing 5.4.4 and requiring it under
      # node 18.20.8 (fails), 20.19.4 (works) and 22.23.1 (works); require(ESM) landed in
      # 22.12 and was backported to 20.19. So the only thing blocking this bump is the
      # `engines.node: >=18` floor, not behavior: v4 and v5 `snakeCase` were also diffed over
      # 20 Prisma-style identifiers (ABCModel, HTTPRequest, User2Post, Model_V2, ...) with
      # zero differences, so generated filenames would not change. Drop this ignore rule as
      # soon as this repo's Node floor moves to >=20.19.
      - dependency-name: 'change-case'
        update-types: ['version-update:semver-major']
      # eslint 10.x and @eslint/js 10.x both require Node >=20.19 (9.x supports 18) -- a
      # grouped dev-dependencies PR bumping both broke the node 18/20/22 CI legs the same day
      # ESLint was first added.
      - dependency-name: 'eslint'
        update-types: ['version-update:semver-major']
      - dependency-name: '@eslint/js'
        update-types: ['version-update:semver-major']
      # typescript-eslint is pinned to the exact 8.55.0 (no caret) for the same reason -- see
      # eslint.config.js/the commit that added it. 8.56.0+ bumps a transitive
      # eslint-visitor-keys dependency to ^5.0.0, which also requires Node >=20.19.
      - dependency-name: 'typescript-eslint'
      # cross-env 10.x requires Node >=20 (7.x supports 18) -- same class of break, caught by
      # the same grouped PR as the eslint bump above.
      - dependency-name: 'cross-env'
        update-types: ['version-update:semver-major']
    commit-message:
      prefix: 'chore'
      include: 'scope'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    commit-message:
      prefix: 'ci'
      include: 'scope'
