name: CI

on:
  pull_request:
  push:
    branches: [main]

# husky's git hooks are a local developer convenience only -- they can't run in CI anyway
# (Actions doesn't commit), and without this every `yarn install` would still spend a step
# installing them. HUSKY=0 makes the `prepare` script a no-op instead. CI, not the hook, is
# the source of truth: every check the hook runs is also run below, on the full tree.
env:
  HUSKY: 0

jobs:
  build-and-test:
    name: build & test (node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [18, 20, 22]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: yarn

      - run: yarn install --frozen-lockfile
      - run: npm run typecheck
      - run: npm run lint
      # eslint-config-prettier *disables* formatting rules rather than checking them, so
      # `npm run lint` alone lets an unformatted file through -- this is the only thing that
      # actually enforces .prettierrc.json on CI.
      - run: npm run format:check
      - run: npm run build
      - run: npm test

      # Coverage doesn't vary by Node version, so this only needs to run once per CI run
      # rather than on every matrix leg -- surfaced in the Actions job summary rather than a
      # hosted badge, since that needs no external service/account to set up.
      - name: Coverage summary
        if: matrix.node-version == 22
        run: |
          echo '## Coverage' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          npm run test:coverage -- --coverageReporters=text-summary --silent 2>&1 | grep -A5 "Coverage summary" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  windows-smoke:
    # Windows is the one OS where Node's `path` module behaves differently enough to matter --
    # path.relative() returns `\`-separated paths, which would produce an invalid
    # `import ... from '..\foo'` in generated output if ever embedded verbatim (see
    # getRelativeTSPath in util.ts). The ubuntu-only matrix above can't catch that class of
    # bug at all, since POSIX path.relative() never produces a backslash to begin with.
    name: build & test (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: yarn

      - run: yarn install --frozen-lockfile
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

  packaging:
    # Everything above validates the *repo*. This validates the artifact npm would actually
    # receive: publint checks package.json's entry points against the packed file list, and
    # the smoke test installs the tarball into an empty project and drives a real
    # `prisma generate` through it by provider name. That combination is what catches a bad
    # `files`/`bin` field, or a runtime import of something that's only a devDependency --
    # none of which the repo's own fully-populated node_modules can reveal.
    name: packaging (tarball)
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: yarn

      - run: yarn install --frozen-lockfile
      - run: npm run build
      - run: npm run lint:package
      - run: npm run verify:packed

  prisma-compat:
    name: prisma ${{ matrix.prisma-version }} (${{ matrix.client-provider }})
    runs-on: ubuntu-latest
    needs: build-and-test
    strategy:
      fail-fast: false
      matrix:
        include:
          - prisma-version: '5'
            client-provider: prisma-client-js
          - prisma-version: '6'
            client-provider: prisma-client-js
          - prisma-version: '7'
            client-provider: prisma-client-js
          - prisma-version: '7'
            client-provider: prisma-client
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: yarn

      - run: yarn install --frozen-lockfile
      - run: npm run build

      - name: Verify prisma@${{ matrix.prisma-version }} + ${{ matrix.client-provider }}
        run: bash scripts/verify-prisma-compat.sh "${{ matrix.prisma-version }}" "${{ matrix.client-provider }}"
