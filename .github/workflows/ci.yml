name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-and-test:
    name: build & test (node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [18, 20, 22]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: yarn

      - run: yarn install --frozen-lockfile
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

      # Coverage doesn't vary by Node version, so this only needs to run once per CI run
      # rather than on every matrix leg -- surfaced in the Actions job summary rather than a
      # hosted badge, since that needs no external service/account to set up.
      - name: Coverage summary
        if: matrix.node-version == 22
        run: |
          echo '## Coverage' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          npm run test:coverage -- --coverageReporters=text-summary --silent 2>&1 | grep -A5 "Coverage summary" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  windows-smoke:
    # Windows is the one OS where Node's `path` module behaves differently enough to matter --
    # path.relative() returns `\`-separated paths, which would produce an invalid
    # `import ... from '..\foo'` in generated output if ever embedded verbatim (see
    # getRelativeTSPath in util.ts). The ubuntu-only matrix above can't catch that class of
    # bug at all, since POSIX path.relative() never produces a backslash to begin with.
    name: build & test (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: yarn

      - run: yarn install --frozen-lockfile
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

  prisma-compat:
    name: prisma ${{ matrix.prisma-version }} (${{ matrix.client-provider }})
    runs-on: ubuntu-latest
    needs: build-and-test
    strategy:
      fail-fast: false
      matrix:
        include:
          - prisma-version: '5'
            client-provider: prisma-client-js
          - prisma-version: '6'
            client-provider: prisma-client-js
          - prisma-version: '7'
            client-provider: prisma-client-js
          - prisma-version: '7'
            client-provider: prisma-client
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: yarn

      - run: yarn install --frozen-lockfile
      - run: npm run build

      - name: Verify prisma@${{ matrix.prisma-version }} + ${{ matrix.client-provider }}
        run: bash scripts/verify-prisma-compat.sh "${{ matrix.prisma-version }}" "${{ matrix.client-provider }}"
