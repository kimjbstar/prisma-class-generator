name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-and-test:
    name: build & test (node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [18, 20, 22]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: yarn

      - run: yarn install --frozen-lockfile
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

  prisma-compat:
    name: prisma ${{ matrix.prisma-version }} (${{ matrix.client-provider }})
    runs-on: ubuntu-latest
    needs: build-and-test
    strategy:
      fail-fast: false
      matrix:
        include:
          - prisma-version: '5'
            client-provider: prisma-client-js
          - prisma-version: '6'
            client-provider: prisma-client-js
          - prisma-version: '7'
            client-provider: prisma-client-js
          - prisma-version: '7'
            client-provider: prisma-client
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: yarn

      - run: yarn install --frozen-lockfile
      - run: npm run build

      - name: Verify prisma@${{ matrix.prisma-version }} + ${{ matrix.client-provider }}
        run: bash scripts/verify-prisma-compat.sh "${{ matrix.prisma-version }}" "${{ matrix.client-provider }}"
