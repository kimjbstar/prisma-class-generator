name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

# See ci.yml -- husky's git hooks are local-only. This also keeps `prepare` from running
# husky during the publish step, where there is nothing for it to install.
env:
  HUSKY: 0

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # No `registry-url` here on purpose: actions/setup-node's registry-url option writes
      # its own .npmrc (pointed to via NPM_CONFIG_USERCONFIG) that expects a NODE_AUTH_TOKEN
      # env var. That .npmrc takes npm config precedence over the one changesets/action
      # writes for NPM_TOKEN below, so with only NPM_TOKEN set (no NODE_AUTH_TOKEN), npm ended
      # up reading the setup-node one with an empty token -- an effectively-unauthenticated
      # publish that failed with a 404 (npm's way of saying "no permission"), not the clearer
      # 401 you'd expect. Reproduced on a real run, not guessed.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: yarn

      - run: yarn install --frozen-lockfile
      - run: npm run build
      - run: npm test

      # Opens/updates a "Version Packages" PR while changesets are pending in .changeset/.
      # Once that PR is merged (no changesets left), this same job publishes to npm and
      # creates the GitHub Release + git tag instead. See CONTRIBUTING.md#releasing.
      #
      # Pinned to the v1 action (paired with @changesets/cli 2.x, see package.json) rather
      # than the newer v2 action + cli 3.x: cli 3.x declares `engines.yarn: >=4.5.2`, which
      # Yarn Classic 1.x (what this repo/CI actually uses) hard-fails on -- confirmed by an
      # actual failed run, not assumed.
      - name: Create release PR or publish to npm
        uses: changesets/action@v1
        with:
          version: npm run changeset:version
          publish: npm run changeset:publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
