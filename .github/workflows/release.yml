name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          registry-url: 'https://registry.npmjs.org'

      - run: yarn install --frozen-lockfile
      - run: npm run build
      - run: npm test

      # Opens/updates a "Version Packages" PR while changesets are pending in .changeset/.
      # Once that PR is merged (no changesets left), this same job publishes to npm and
      # creates the GitHub Release + git tag instead. See CONTRIBUTING.md#releasing.
      - name: Create release PR or publish to npm
        uses: changesets/action@v2
        with:
          version-script: npm run changeset:version
          publish-script: npm run changeset:publish
          create-github-releases: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
